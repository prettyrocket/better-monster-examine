name: Feature request
description: Suggest a new feature or an improvement to an existing one.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What's the problem?
      description: What are you trying to do that the plugin makes hard or impossible today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like it to do?
      description: Describe the behaviour you'd like. Mockups or a link to how the wiki presents it are welcome.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Anything you've considered or already tried?
    validations:
      required: false

  - type: checkboxes
    id: contribute
    attributes:
      label: Would you like to build it?
      options:
        - label: I'd be interested in opening a PR for this
          required: false
